<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traductor</title>
    <meta name="theme-color" content="#2684ca">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Traductor">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f2f7fb;
            color: #2d3a45;
            line-height: 1.4;
        }
        h1 { font-size: 20px; text-align: center; color: #1a5f8c; margin: 8px 0 16px; }
        .tarjeta {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
        .tarjeta h2 { font-size: 15px; margin: 0 0 10px; color: #1a5f8c; }
        textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid #bcd;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            resize: vertical;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #bcd;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 10px;
        }
        .fila-info { font-size: 12px; color: #6a7a88; text-align: right; margin-top: 4px; }
        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            background: #2684ca;
            color: #fff;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
        }
        button:active { background: #1a5f8c; }
        .salida {
            min-height: 60px;
            background: #eef6fb;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .mensaje { font-size: 13px; color: #c62828; text-align: center; margin-top: 8px; }
        .fila-botones { display: flex; gap: 8px; }
        .fila-botones button { flex: 1; }
        .btn-mic { background: #2e9e6c !important; }
        .btn-audio { background: #8a5a2e !important; }
        .grabando { background: #c62828 !important; }
        .etiqueta { font-size: 13px; color: #4a5a68; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Tradutor</h1>

    <div class="tarjeta">
        <h2>Texto a traducir</h2>
        <select id="idioma">
            <option value="" selected>Detectar idioma automaticamente</option>
            <option value="en">Ingles</option>
            <option value="fr">Frances</option>
            <option value="it">Italiano</option>
            <option value="pt">Portugues</option>
            <option value="de">Aleman</option>
            <option value="es">Espanol</option>
        </select>
        <div class="etiqueta">Traducir a:</div>
        <select id="destino">
            <option value="es" selected>Espanol</option>
            <option value="en">Ingles</option>
            <option value="fr">Frances</option>
            <option value="it">Italiano</option>
            <option value="pt">Portugues</option>
            <option value="de">Aleman</option>
        </select>
        <textarea id="origen" placeholder="Pega aqui el texto que quieres traducir..."></textarea>
        <div class="fila-info" id="contador">0 caracteres</div>
        <div class="fila-botones">
            <button class="btn-mic" onclick="dictar()">🎤 Hablar</button>
            <button onclick="traducir()">Traducir</button>
        </div>
    </div>

    <div class="tarjeta">
        <h2>Traduccion</h2>
        <div class="salida" id="salida">Aqui aparecera tu texto traducido.</div>
        <div class="fila-botones">
            <button class="btn-audio" onclick="escuchar()">🔊 Escuchar</button>
            <button onclick="copiar()">Copiar</button>
        </div>
        <div class="mensaje" id="msg"></div>
    </div>

    <script>
        var origen = document.getElementById('origen');
        origen.addEventListener('input', function () {
            document.getElementById('contador').textContent = origen.value.length + ' caracteres';
        });

        function traducir() {
            var texto = origen.value.trim();
            var msg = document.getElementById('msg');
            msg.textContent = '';
            if (!texto) {
                msg.textContent = 'Pega primero un texto para traducir.';
                return;
            }
            if (texto.length > 5000) {
                msg.textContent = 'El texto es muy largo para el servicio gratuito (maximo 5000 caracteres). Traduce por partes.';
                return;
            }
            var idioma = document.getElementById('idioma').value;
            var destino = document.getElementById('destino').value;
            var salida = document.getElementById('salida');
            salida.textContent = 'Traduciendo...';
            if (idioma) {
                pedir(texto, idioma, destino);
            } else {
                detectar(texto, destino);
            }
        }

        function pedir(texto, idioma, destino) {
            fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + idioma + '&tl=' + destino + '&dt=t&q=' + encodeURIComponent(texto))
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    var partes = [];
                    function recorrer(arr) {
                        for (var i = 0; i < arr.length; i++) {
                            if (Array.isArray(arr[i])) {
                                recorrer(arr[i]);
                            } else if (typeof arr[i] === 'string' && arr[i].trim()) {
                                partes.push(arr[i]);
                            }
                        }
                    }
                    recorrer(j);
                    document.getElementById('salida').textContent = partes.join('') || '(sin traduccion)';
                })
                .catch(function () {
                    document.getElementById('salida').textContent = '(Error al conectar. Revisa tu internet e intenta de nuevo.)';
                });
        }

        function detectar(texto, destino) {
            fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + destino + '&dt=t&q=' + encodeURIComponent(texto))
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    var idiomaDetectado = j[2];
                    document.getElementById('idioma').value = (idiomaDetectado && idiomaDetectado !== 'es') ? idiomaDetectado : '';
                    var partes = [];
                    function recorrer(arr) {
                        for (var i = 0; i < arr.length; i++) {
                            if (Array.isArray(arr[i])) {
                                recorrer(arr[i]);
                            } else if (typeof arr[i] === 'string' && arr[i].trim()) {
                                partes.push(arr[i]);
                            }
                        }
                    }
                    recorrer(j);
                    document.getElementById('salida').textContent = partes.join('') || '(sin traduccion)';
                })
                .catch(function () {
                    document.getElementById('salida').textContent = '(Error al conectar. Revisa tu internet e intenta de nuevo.)';
                });
        }

        function copiar() {
            var contenido = document.getElementById('salida').textContent;
            if (!contenido || contenido.indexOf('Aqui aparecera') === 0) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(contenido).then(function () {
                    document.getElementById('msg').textContent = 'Copiado. Ya lo puedes pegar donde quieras.';
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = contenido;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); document.getElementById('msg').textContent = 'Copiado.'; }
                catch (e) { document.getElementById('msg').textContent = 'No se pudo copiar. Selecciona el texto y copialo a mano.'; }
                document.body.removeChild(ta);
            }
        }

        function dictar() {
            var msg = document.getElementById('msg');
            var btn = document.querySelector('.btn-mic');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                msg.textContent = 'Tu navegador no soporta dictado por voz (usa Chrome).';
                return;
            }
            var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            var rec = new SR();
            var idioma = document.getElementById('idioma').value;
            var codigo = idioma || 'es';
            rec.lang = (codigo === 'es') ? 'es-CO' : codigo;
            rec.interimResults = true;
            rec.continuous = true;
            rec.onstart = function () {
                btn.classList.add('grabando');
                btn.textContent = '🎤 Escuchando...';
                msg.textContent = 'Habla ahora. Toca el boton para terminar.';
                msg.style.color = '#2e9e6c';
            };
            rec.onresult = function (e) {
                var texto = '';
                for (var i = e.resultIndex; i < e.results.length; i++) {
                    texto += e.results[i][0].transcript;
                }
                document.getElementById('origen').value = texto;
                document.getElementById('contador').textContent = texto.length + ' caracteres';
            };
            rec.onend = function () {
                btn.classList.remove('grabando');
                btn.textContent = '🎤 Hablar';
                msg.textContent = '';
            };
            rec.onerror = function (e) {
                btn.classList.remove('grabando');
                btn.textContent = '🎤 Hablar';
                if (e.error === 'not-allowed') {
                    msg.textContent = 'Necesito permiso para usar el microfono. Ve a Ajustes y permitelo.';
                } else if (e.error === 'no-speech') {
                    msg.textContent = 'No escuche nada. Habla mas cerca del microfono e intenta otra vez.';
                } else {
                    msg.textContent = 'Problema con el microfono: ' + e.error;
                }
            };
            if (btn.classList.contains('grabando')) {
                rec.stop();
                return;
            }
            try { rec.start(); } catch (e) { }
        }

        function escuchar() {
            var msg = document.getElementById('msg');
            var contenido = document.getElementById('salida').textContent;
            if (!contenido || contenido.indexOf('Aqui aparecera') === 0 || contenido.indexOf('Traduciendo') === 0 || contenido.indexOf('(') === 0) {
                msg.textContent = 'Primero traduce un texto para poder escucharlo.';
                return;
            }
            if (!('speechSynthesis' in window)) {
                msg.textContent = 'Tu navegador no soporta la lectura en voz alta.';
                return;
            }
            var destino = document.getElementById('destino').value;
            var codigo = (destino === 'es') ? 'es-CO' : (destino === 'de') ? 'de-DE' : destino;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(contenido);
            u.lang = codigo;
            u.onerror = function () {
                msg.textContent = 'No se pudo reproducir el audio. Revisa que el sonido del telefono este encendido.';
            };
            window.speechSynthesis.speak(u);
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('SW error', e); });
        }
    </script>
</body>
</html>
